# Keycloak (phase 3): one login for engineers across Nautobot, Zabbix, GLPI and Grafana,
# and the place where customer portal accounts are managed. See the guide, section on single sign-on.
services:
  keycloak:
    # Optional: started only when COMPOSE_PROFILES in .env lists "sso" (add sso to COMPOSE_PROFILES in .env, see the guide).
    profiles: ["sso"]
    image: ${KEYCLOAK_IMAGE}
    restart: unless-stopped
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://sso.${MSP_DOMAIN}
      KC_HTTP_ENABLED: "true"          # TLS ends at the reverse proxy
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      TZ: ${TZ}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [msp]

networks:
  msp:
    external: true
    name: msp
