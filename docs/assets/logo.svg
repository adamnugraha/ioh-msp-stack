    <circle cx="118" cy="58" r="9"/>
    <circle cx="118" cy="102" r="9"/>
    <circle cx="80" cy="124" r="9"/>
    <circle cx="42" cy="102" r="9"/>
    <circle cx="42" cy="58" r="9"/>
