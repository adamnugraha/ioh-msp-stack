# One page, no outside connections: the content security policy blocks any request from the page
# except the operator's own logo on this server.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # The operator's logo from a mounted folder (docker run -v <kit>/branding:/usr/share/nginx/html/brand:ro).
    # Nothing mounted: 204 (no content), and the page shows its neutral mark.
    location = /brand/logo {
        access_log off;
        try_files /brand/logo.svg /brand/logo.png =204;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    location / { try_files /index.html =404; }
}
