[project]
name = "msp-glue"
version = "1.2.0"
description = "Integration service for the IOH open-source managed services platform"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # MSP Console
    "jinja2>=3.1",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mspctl = "msp_glue.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["msp_glue*"]

[tool.setuptools.package-data]
# ui: the built pages (console-ui, "npm run build"); the image build makes them
"msp_glue.console" = ["templates/*.html", "static/*", "ui/*", "ui/assets/*"]
