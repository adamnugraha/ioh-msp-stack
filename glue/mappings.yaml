# =============================================================================
# msp-glue mapping rules: how Nautobot data becomes monitoring, assets and tickets.
# Edit this file, restart msp-glue (docker compose restart msp-glue), then apply it to existing
# customers with "mspctl tenant sync --all" and "mspctl device sync".
# Template names must match Zabbix exactly (Data collection > Templates).
# =============================================================================

tenancy:
  # Only Nautobot tenants in this tenant group are treated as managed customers.
  tenant_group: "Managed Services Customers"
  # Short code used in names everywhere (Zabbix groups, Semaphore project, Git repository).
  # Taken from the tenant custom field "msp_code" (for example "acme").

zabbix:
  customer_group_root: "Customers"                # host groups: Customers/<Tenant>/<Role>
  noc_usergroup: "MSP NOC engineers"              # read-write on every customer host group
  manager_usergroup: "MSP managers"               # read on every customer host group (single sign-on, managers)
  service_usergroup: "MSP service accounts"       # read on every customer group (ticketing webhook user)
  customer_readonly_suffix: "read-only"           # one read-only user group per customer
  macro_template_group: "MSP/Customer settings"   # holds one macro template per customer
  default_proxy_group: "pg-central"               # used when the customer has no dedicated proxy group
  # Nautobot device status -> Zabbix host status (0 = monitored, 1 = not monitored).
  # Devices with any other status are not pushed to Zabbix.
  status:
    Active: 0
    Offline: 1
    Decommissioning: 1
  # Chosen by the Nautobot platform's network driver. "interface" is snmp or agent.
  platforms:
    cisco_ios:         {interface: snmp,  templates: ["Cisco IOS by SNMP"]}
    cisco_xe:          {interface: snmp,  templates: ["Cisco IOS by SNMP"]}
    cisco_nxos:        {interface: snmp,  templates: ["Cisco Nexus 9000 Series by SNMP"]}
    cisco_asa:         {interface: snmp,  templates: ["Cisco ASAv by SNMP"]}
    arista_eos:        {interface: snmp,  templates: ["Arista by SNMP"]}
    juniper_junos:     {interface: snmp,  templates: ["Juniper by SNMP"]}
    fortinet:          {interface: snmp,  templates: ["FortiGate by SNMP"]}
    paloalto_panos:    {interface: snmp,  templates: ["Network Generic Device by SNMP"]}
    checkpoint_gaia:   {interface: snmp,  templates: ["Check Point Next Generation Firewall by SNMP"]}
    mikrotik_routeros: {interface: snmp,  templates: ["Mikrotik by SNMP"]}
    huawei_vrp:        {interface: snmp,  templates: ["Huawei VRP by SNMP"]}
    huawei_vrpv8:      {interface: snmp,  templates: ["Huawei VRP by SNMP"]}
    hp_comware:        {interface: snmp,  templates: ["HP Comware HH3C by SNMP"]}
    hp_procurve:       {interface: snmp,  templates: ["HP Enterprise Switch by SNMP"]}
    aruba_aoscx:       {interface: snmp,  templates: ["Aruba CX 8300s by SNMP"]}
    tplink_jetstream:  {interface: snmp,  templates: ["TP-LINK by SNMP"]}
    linux:             {interface: agent, templates: ["Linux by Zabbix agent", "ICMP Ping"]}
    windows:           {interface: agent, templates: ["Windows by Zabbix agent", "ICMP Ping"]}
  default_platform:    {interface: snmp,  templates: ["Network Generic Device by SNMP"]}
  # Added to every managed host, whatever the platform. Keep this short: the SNMP device
  # templates already contain ICMP checks, so "ICMP Ping" is listed per platform above
  # (agent-based only); linking it twice makes Zabbix reject the host.
  always_templates: []
  # Monthly availability per customer (Services > SLA report in Zabbix). Downtime counts only while a
  # problem tagged scope=availability (for example "Unavailable by ICMP ping") of at least this
  # severity is open on one of the customer's hosts. 4 = High, 5 = Disaster.
  sla:
    severity: 4
    slo: {gold: "99.9", silver: "99.5", bronze: "99.0"}
  # SNMP settings written on every SNMP interface. The values are macros resolved
  # from the customer's macro template, so secrets never sit on individual hosts.
  snmp:
    version: 2            # 2 or 3; per-customer override with the tenant custom field msp_snmp_version
    community_macro: "{$SNMP_COMMUNITY}"
    v3:
      securityname: "{$SNMPV3_USER}"
      securitylevel: 2    # authPriv
      authprotocol: 1     # 0 MD5, 1 SHA1, 2 SHA224, 3 SHA256, 4 SHA384, 5 SHA512
      privprotocol: 1     # 0 DES, 1 AES128, 2 AES192, 3 AES256
      authpassphrase: "{$SNMPV3_AUTHPASS}"
      privpassphrase: "{$SNMPV3_PRIVPASS}"

glpi:
  # Parent entity of every customer entity. Created under the GLPI root entity.
  msp_entity: "IOH Managed Services"
  # Nautobot device role -> GLPI asset type. Anything not listed uses default_itemtype.
  itemtype_by_role:
    server: Computer
    hypervisor: Computer
    virtual-machine: Computer
  default_itemtype: NetworkEquipment
  # Nautobot device status -> GLPI asset status (created if missing).
  state_by_status:
    Active: "In production"
    Planned: "Planned"
    Staged: "Staged"
    Offline: "Out of order"
    Decommissioning: "Decommissioning"
    Inventory: "In stock"
  # Ticket defaults for alerts coming from Zabbix and drift found by Golden Config.
  monitoring_request_type: "Monitoring"
  noc_group: "NOC Level 1"
  categories:
    monitoring: "Managed infrastructure > Monitoring alert"
    compliance: "Managed infrastructure > Configuration drift"
    change: "Managed infrastructure > Standard change"
  # Service tiers: one service level agreement pair (time to own, time to resolve) each.
  # The customer's tier comes from the Nautobot tenant custom field msp_service_tier.
  calendars:
    "24x7": {days: [0, 1, 2, 3, 4, 5, 6], begin: "00:00:00", end: "24:00:00"}
    "Business hours WIB": {days: [1, 2, 3, 4, 5], begin: "08:00:00", end: "17:00:00"}
  service_tiers:
    gold:   {calendar: "24x7",               own_minutes: 15,  resolve_hours: 4}
    silver: {calendar: "24x7",               own_minutes: 30,  resolve_hours: 8}
    bronze: {calendar: "Business hours WIB", own_minutes: 120, resolve_hours: 24}

semaphore:
  # Shared playbook repository (Forgejo organisation/repository).
  playbook_repo: "msp/playbooks"
  playbook_branch: "main"
  # The Semaphore image ships the Ansible community package, which already contains the common
  # network collections (ansible.netcommon, cisco.ios, cisco.nxos, arista.eos, junipernetworks.junos,
  # community.routeros, fortinet.fortios). true = use those, no Internet needed at run time.
  # false = install collections/requirements.yml from Ansible Galaxy before every run (needs Internet
  # or an internal Galaxy mirror), for example to add community.network for Huawei.
  skip_galaxy_install: true
  # Created in every customer project. Names are referenced by automation rules below.
  templates:
    - name: "Collect diagnostics"
      playbook: "playbooks/collect-diagnostics.yml"
      description: "Read-only: gathers show commands or system facts and stores them in the task log."
    - name: "Bounce interface"
      playbook: "playbooks/bounce-interface.yml"
      description: "Shuts and re-enables one interface. Needs an approved change."
    - name: "Linux patching"
      playbook: "playbooks/linux-patching.yml"
      description: "Applies security updates to Linux servers. Needs an approved change."

automation:
  # When a GLPI change in one of these categories is approved, run the matching template
  # in the customer's Semaphore project. Variables come from the change's description
  # block "automation:" (see the guide) and are passed as Ansible extra variables.
  change_templates:
    "Managed infrastructure > Standard change > Bounce interface": "Bounce interface"
    "Managed infrastructure > Standard change > Linux patching": "Linux patching"
    "Managed infrastructure > Standard change > Collect diagnostics": "Collect diagnostics"

golden_config:
  # Nautobot platforms Golden Config backs up and checks. Each needs a template named after its
  # network driver in the golden-config repository (templates/<network_driver>.j2).
  platforms: ["Cisco IOS", "Cisco IOS-XE", "Cisco NX-OS", "Cisco ASA", "FortiOS", "Junos", "Arista EOS",
              "RouterOS", "Huawei VRP", "AOS-CX", "Comware", "TP-Link JetStream"]
  # Per-customer Golden Config settings point at a per-customer backup repository.
  backup_repo_prefix: "backups-"
  shared_intended_repo: "msp/intended-configs"
  shared_templates_repo: "msp/golden-config"
  backup_path_template: "{{obj.location.name|slugify}}/{{obj.name}}.cfg"
  intended_path_template: "{{obj.tenant.name|slugify}}/{{obj.location.name|slugify}}/{{obj.name}}.cfg"
  jinja_path_template: "templates/{{obj.platform.network_driver}}.j2"
  sotagg_query_name: "MSP golden config data"

console:
  # Semaphore templates that change devices. The MSP Console starts these only for a GLPI change in
  # status Accepted of the same customer; any other template needs an open ticket or change.
  # Add the names of your own templates that change something.
  change_only_templates: ["Bounce interface", "Linux patching"]

chat:
  # Problems on managed devices of this severity or worse go to the NOC chat (./scripts/install.sh chat):
  # 2 Warning, 3 Average, 4 High, 5 Disaster.
  min_severity: 4
  # Wait this long before the first message: a problem that clears by itself within it never reaches the
  # chat, and the message can already name the GLPI ticket. 0 sends at once; otherwise 1m or more.
  delay: 1m

path_tests:
  # Path tests from each site collector (kit 1.6.0): msp-glue keeps one Zabbix host per collector and target,
  # monitored by that collector. Every customer gets the targets below; a customer adds its own in the Nautobot
  # tenant field msp_path_targets (a JSON list, see the guide), for example IOH's edge router at its site.
  # Segments: ioh (IOH's edge router at the site), internet (a public point beyond IOH), application (what the
  # customer uses). The console compares them to say on which side of the path a slowdown is.
  # Checks: icmp (ping), tcp (open a connection to port), https (one web request to url).
  defaults:
    - {name: "Internet reference (Cloudflare)", address: 1.1.1.1, segment: internet, checks: [icmp]}
    - {name: "Internet reference (Google)", address: 8.8.8.8, segment: internet, checks: [icmp]}
    - {name: "Microsoft 365", url: "https://outlook.office365.com/", segment: application, checks: [https]}
    - {name: "Google services", url: "https://www.google.com/generate_204", segment: application, checks: [https]}
  # Limits for every target; a target can set its own (rtt_ms, loss_percent, http_ms).
  limits:
    rtt_ms: 150          # delay (ping or connection time), average over 15 minutes
    loss_percent: 5      # packet loss, average over 15 minutes
    http_ms: 2000        # web response time, average over 30 minutes
  interval: 1m           # ping and connection checks
  http_interval: 5m      # web requests

capacity:
  # Link capacity early warning (kit 1.6.0). Once a day msp-glue reads the busy-hour traffic of every interface that
  # ends a circuit in Nautobot (Zabbix hourly averages), compares it with the circuit's commit rate (the interface
  # speed when the circuit has none) and forecasts when it reaches warn_percent.
  warn_percent: 80
  history_days: 28       # days of traffic the forecast is drawn from
  min_days: 14           # fewer days of data than this: no forecast yet
  horizon_days: 45       # a link forecast to reach warn_percent within this many days is "at risk"
  # One GLPI ticket per link at risk or already above warn_percent, in the customer's entity, for the NOC group.
  tickets: true
  ticket_category: "Managed infrastructure > Capacity warning"
  hour: 3                # local hour of the daily run

reports:
  # Monthly customer report (kit 1.6.0): on the first days of each month the MSP Console drafts last month's
  # report for every customer; an engineer checks it and approves it before it goes to the customer. The text is
  # written by the console's model endpoint (CONSOLE_AI_URL and CONSOLE_AI_MODEL in .env) when one is set, and
  # from fixed sentences when not. Every figure comes from the tools; the console flags any number in the text
  # that the data does not contain.
  draft_day: 1           # drafts are made from this day of the month
  hour: 2                # local hour, so the model works at night
  default_language: id   # id = Bahasa Indonesia, en = English; per customer: tenant field msp_report_language
