{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block main %}
<section class="card message">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if retry %}<p><a class="btn primary" href="{{ retry }}">{{ retry_label or 'Try again' }}</a></p>{% endif %}
</section>
{% endblock %}
