# Container images of the kit, on Docker Hub as <repository>:<name>-<version>.
#
#   glue             msp-glue and the MSP Console          ioh-msp-stack:glue-1.2.0
#   nautobot         Nautobot with Golden Config           ioh-msp-stack:nautobot-3.2.6-gc3.0.8
#   console-preview  the console preview with sample data  ioh-msp-stack:console-preview
#
# Every push that touches an image builds it and scans it with Trivy. Images are pushed only from
# main, or when someone starts the workflow by hand (Actions > Images > Run workflow), and only when
# the repository has the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. The repository defaults to
# docker.io/adityanugraha/ioh-msp-stack; set the variable DOCKERHUB_REPOSITORY to change it.
#
# Actions are pinned to full commit hashes: tags can be moved, commits cannot.

name: Images

on:
  push:
    paths:
      - "glue/**"
      - "components/nautobot/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: glue
            context: glue
            file: glue/Dockerfile
          - name: nautobot
            context: components/nautobot
            file: components/nautobot/Dockerfile
          - name: console-preview
            context: glue/console-ui
            file: glue/console-ui/Dockerfile.preview
    env:
      REPOSITORY: docker.io/${{ vars.DOCKERHUB_REPOSITORY || 'adityanugraha/ioh-msp-stack' }}
      HAVE_HUB: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
      PUBLISH: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version and tags
        id: meta
        run: |
          set -euo pipefail
          short=${GITHUB_SHA::7}
          case "${{ matrix.name }}" in
            glue)
              version=$(sed -n 's/^version = "\(.*\)"/\1/p' glue/pyproject.toml)
              tags="glue-${version} glue-${version%.*} glue-${short}"
              args="" ;;
            nautobot)
              version=$(sed -n 's/^NAUTOBOT_TAG=msp\/nautobot://p' scripts/install.sh)
              base=$(sed -n 's/^NAUTOBOT_IMAGE=//p' .env.example)
              tags="nautobot-${version} nautobot-${short}"
              args="NAUTOBOT_IMAGE=${base}" ;;
            console-preview)
              version=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' glue/console-ui/package.json | head -n 1)
              tags="console-preview console-preview-${version} console-preview-${short}"
              args="" ;;
          esac
          [ -n "$version" ] || { echo "could not read the version of ${{ matrix.name }}"; exit 1; }
          {
            echo "version=${version}"
            echo "tags=${tags}"
            echo "args<<EOF"
            echo "${args}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "${{ matrix.name }} ${version}: ${tags}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ steps.meta.outputs.args }}
          tags: local/${{ matrix.name }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Scan with Trivy (high and critical, fixed upstream)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.name }}:ci
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Sign in to Docker Hub
        if: env.HAVE_HUB == 'true' && env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: env.HAVE_HUB == 'true' && env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker tag "local/${{ matrix.name }}:ci" "${REPOSITORY}:${tag}"
            docker push -q "${REPOSITORY}:${tag}"
            echo "- \`${REPOSITORY}:${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Why nothing was pushed
        if: env.HAVE_HUB != 'true' || env.PUBLISH != 'true'
        run: |
          if [ "$HAVE_HUB" != "true" ]; then
            echo "Built and scanned, not pushed: add the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Settings > Secrets and variables > Actions)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Built and scanned, not pushed: images are pushed from main, or when the workflow is started by hand." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
