# Lab only: simulated customer devices on the platform network.
#   docker compose -f lab/compose.devices.yaml up -d
services:
  lab-acme-rtr01:
    image: msp/lab-fakenos:1.2.1
    build: ./fakenos
    environment:
      DEVICE_NAME: jkt01-rtr01
      # Deliberate drift: the standard has two NTP servers, this router only has one.
      NTP_SERVERS: "10.255.0.1"
      LOG_HOSTS: "10.255.0.10"
    networks: [msp]
  lab-acme-srv01:
    image: msp/lab-linux:1.0
    build: ./linux-server
    networks: [msp]
  lab-bankx-rtr01:
    image: msp/lab-fakenos:1.2.1
    environment:
      DEVICE_NAME: ckr01-rtr01
      NTP_SERVERS: "10.255.0.1,10.255.0.2"
      LOG_HOSTS: "10.255.0.10"
    networks: [msp]

networks:
  msp:
    external: true
    name: msp
