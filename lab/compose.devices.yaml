# Lab only: simulated customer devices on the platform network.
#   docker compose -f lab/compose.devices.yaml up -d
# Fixed addresses (run-lab.sh sets them from MSP_SUBNET: .201 to .203), so a restart of Docker cannot
# hand a device's address to another container while Nautobot and Zabbix still point at it.
services:
  lab-acme-rtr01:
    image: msp/lab-fakenos:1.2.1
    build: ./fakenos
    environment:
      DEVICE_NAME: jkt01-rtr01
      # Deliberate drift: the standard has two NTP servers, this router only has one.
      NTP_SERVERS: "10.255.0.1"
      LOG_HOSTS: "10.255.0.10"
    networks:
      msp: {ipv4_address: "${LAB_IP_ACME_RTR01:-172.30.0.201}"}
  lab-acme-srv01:
    image: msp/lab-linux:1.0
    build: ./linux-server
    networks:
      msp: {ipv4_address: "${LAB_IP_ACME_SRV01:-172.30.0.202}"}
  # The lab server's Zabbix agent, in the server's own network (it answers on the server's address, port 10050),
  # so the console has CPU, memory, disk and traffic charts for a server.
  lab-acme-srv01-agent:
    image: zabbix/zabbix-agent2:${ZABBIX_IMAGE_TAG:-alpine-7.0.31}
    network_mode: "service:lab-acme-srv01"
    depends_on: [lab-acme-srv01]
    # Agent 2 stops when one of its plugins starts slowly on a busy machine; it starts fine the next time.
    restart: on-failure
    environment:
      ZBX_HOSTNAME: acme-jkt01-srv01
      ZBX_PASSIVESERVERS: "${MSP_SUBNET:-172.30.0.0/24}"
      ZBX_ACTIVE_ALLOW: "false"
  lab-bankx-rtr01:
    image: msp/lab-fakenos:1.2.1
    environment:
      DEVICE_NAME: ckr01-rtr01
      NTP_SERVERS: "10.255.0.1,10.255.0.2"
      LOG_HOSTS: "10.255.0.10"
    networks:
      msp: {ipv4_address: "${LAB_IP_BANKX_RTR01:-172.30.0.203}"}

networks:
  msp:
    external: true
    name: msp
